modules:
  - id: "mod-mcp-server"
    name: "MCP Server Gateway"
    description: "Standard Model Context Protocol gateway with stdio transport"
    version: "0.1.0"
    entrypoint: "src/server/index.ts"
    observableType: "CLI"
    harnessCommand: "npx vitest run tests/integration/mcp-server.test.ts"
    status: "VERIFIED"
  - id: "mod-task-engine"
    name: "Task DAG & State Machine Engine"
    description: "Enforces 8-state machine transitions and completion gate"
    version: "0.1.0"
    entrypoint: "src/engine/task-engine.ts"
    observableType: "CLI"
    harnessCommand: "npx vitest run tests/integration/completion-gate.test.ts"
    status: "VERIFIED"
  - id: "mod-storage-engine"
    name: "SQLite State Store"
    description: "Operational ACID state store with .vibe file store sync"
    version: "0.1.0"
    entrypoint: "src/storage/sqlite.ts"
    observableType: "CLI"
    harnessCommand: "npx vitest run tests/unit/state-store.test.ts"
    status: "VERIFIED"
