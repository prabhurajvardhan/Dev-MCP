systemDesign: "Layered agentic control plane separating transport, state storage, execution policies, and completion gates."
modules:
  - id: "mod-server"
    name: "Server Transport Layer"
    observableType: "CLI"
    entrypoint: "src/server/index.ts"
  - id: "mod-engine"
    name: "Core Engineering Engine"
    observableType: "CLI"
    entrypoint: "src/engine/"
  - id: "mod-storage"
    name: "Operational Storage Engine"
    observableType: "CLI"
    entrypoint: "src/storage/sqlite.ts"
  - id: "mod-execution"
    name: "Workspace & Command Execution"
    observableType: "CLI"
    entrypoint: "src/execution/"
interfaces:
  - id: "int-mcp-v1"
    name: "Model Context Protocol JSON-RPC"
    contract: "Official MCP Protocol 2024-11-05 Specification"
  - id: "int-state-store"
    name: "SQLite Operational Store Interface"
    contract: "ACID queries for projects, tasks, modules, contracts, evidence, checkpoints"
dependencies:
  - from: "mod-server"
    to: "mod-engine"
  - from: "mod-engine"
    to: "mod-storage"
  - from: "mod-engine"
    to: "mod-execution"
